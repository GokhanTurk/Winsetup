<text x="22" y="70" xml:space="preserve"><tspan class="a1" fill="#3377FF">PS C:\Users\gokhan&gt; </tspan><tspan class="a2" fill="#DDEEFF">i</tspan><tspan class="a3" fill="#DDEEFF">r</tspan><tspan class="a4" fill="#DDEEFF">m</tspan><tspan class="a5" fill="#DDEEFF"> </tspan><tspan class="a6" fill="#DDEEFF">g</tspan><tspan class="a7" fill="#DDEEFF">o</tspan><tspan class="a8" fill="#DDEEFF">k</tspan><tspan class="a9" fill="#DDEEFF">h</tspan><tspan class="a10" fill="#DDEEFF">a</tspan><tspan class="a11" fill="#DDEEFF">n</tspan><tspan class="a12" fill="#DDEEFF">t</tspan><tspan class="a13" fill="#DDEEFF">u</tspan><tspan class="a14" fill="#DDEEFF">r</tspan><tspan class="a15" fill="#DDEEFF">k</tspan><tspan class="a16" fill="#DDEEFF">.</tspan><tspan class="a17" fill="#DDEEFF">c</tspan><tspan class="a18" fill="#DDEEFF">o</tspan><tspan class="a19" fill="#DDEEFF">m</tspan><tspan class="a20" fill="#DDEEFF">/</tspan><tspan class="a21" fill="#DDEEFF">w</tspan><tspan class="a22" fill="#DDEEFF">i</tspan><tspan class="a23" fill="#DDEEFF">n</tspan><tspan class="a24" fill="#DDEEFF"> </tspan><tspan class="a25" fill="#DDEEFF">|</tspan><tspan class="a26" fill="#DDEEFF"> </tspan><tspan class="a27" fill="#DDEEFF">i</tspan><tspan class="a28" fill="#DDEEFF">e</tspan><tspan class="a29" fill="#DDEEFF">x</tspan></text>
<text class="a30" x="22" y="112" xml:space="preserve"><tspan fill="#22BBDD">  Winsetup — profil seç</tspan></text>
<text class="a31" x="22" y="133" xml:space="preserve"><tspan fill="#DDEEFF">  1) Oyun         Full debloat + Edge kaldır + oyun ayarları + Steam + kişisel ortam</tspan></text>
<text class="a32" x="22" y="154" xml:space="preserve"><tspan fill="#DDEEFF">  2) İş           Standart debloat (Edge/Teams/Outlook kalır) + kişisel ortam</tspan></text>
<text class="a33" x="22" y="175" xml:space="preserve"><tspan fill="#DDEEFF">  3) Sanal makine Full debloat + kişisel ortam (Steam/oyun ayarı yok)</tspan></text>
<text class="a34" x="22" y="196" xml:space="preserve"><tspan fill="#DDEEFF">  4) Standart     Genel kullanıcı: sadece çöpler, reklamlar ve telemetri</tspan></text>
<text class="a35" x="22" y="217" xml:space="preserve"><tspan fill="#DDEEFF">  5) Debloat      Sadece uygulama kaldırma</tspan></text>
<text class="a36" x="22" y="238" xml:space="preserve"><tspan fill="#DDEEFF">  6) Neovim       Neovim + config (kuruluysa sadece config)</tspan></text>
<text class="a37" x="22" y="259" xml:space="preserve"><tspan fill="#DDEEFF">  7) Terminal     Tüm terminal ve CLI ortamı + configler (kurulu olanlar atlanır)</tspan></text>
<text class="a38" x="22" y="280" xml:space="preserve"><tspan fill="#556677">  0) Çıkış</tspan></text>
<text x="22" y="322" xml:space="preserve"><tspan class="a39" fill="#DDEEFF">  Seçim: </tspan><tspan class="a40" fill="#FAF713">1</tspan></text>
<text class="a41" x="22" y="364" xml:space="preserve"><tspan fill="#DDEEFF">  Devam edilsin mi? (E/H) </tspan><tspan fill="#FAF713">e</tspan></text>
<text class="a42" x="22" y="385" xml:space="preserve"><tspan fill="#DDEEFF">  Terminal arka planına BJK logosu konsun mu? (E/H) </tspan><tspan fill="#FAF713">e</tspan></text>
<text class="a43" x="22" y="406" xml:space="preserve"><tspan fill="#DDEEFF">  Önce geri yükleme noktası oluşturulsun mu? (E/H) </tspan><tspan fill="#FAF713">e</tspan></text>
<text class="a44" x="22" y="70" xml:space="preserve"><tspan fill="#22BBDD">  Profil: Oyun</tspan></text>
<text class="a45" x="22" y="112" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 1/20] Debloat (Full)</tspan></text>
<text class="a46" x="22" y="133" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 2/20] Edge kaldır (WebView2 kalır)</tspan></text>
<text class="a47" x="22" y="154" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 3/20] OneDrive kaldır</tspan></text>
<text class="a48" x="22" y="175" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 5/20] Tüm bildirimler kapalı</tspan></text>
<text class="a49" x="22" y="196" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 6/20] Klavye sadece Türkçe Q</tspan></text>
<text class="a50" x="22" y="217" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[ 9/20] Arayüz temizliği</tspan></text>
<text class="a51" x="22" y="238" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[12/20] Timer resolution servisi</tspan></text>
<text class="a52" x="22" y="259" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[14/20] Uygulamalar: Steam, Firefox, mpv</tspan></text>
<text class="a53" x="22" y="280" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[18/20] Kişisel terminal ortamı</tspan></text>
<text class="a54" x="22" y="301" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[19/20] Başlat menüsü: liste görünümü</tspan></text>
<text class="a55" x="22" y="322" xml:space="preserve"><tspan fill="#33FF11">  ✓ </tspan><tspan fill="#DDEEFF">[20/20] Gereksiz Windows bileşenleri</tspan></text>
<text class="a56" x="22" y="364" xml:space="preserve"><tspan fill="#33FF11">  Bitti. Log: %TEMP%\Winsetup.log</tspan></text>
